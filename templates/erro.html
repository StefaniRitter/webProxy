<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Negado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f4f4f4;
        }
        
        .container {
            width: min(92vw, 900px);
            text-align: center;
            animation: slideIn 0.8s ease-out;
            transform: translateY(-6vh);
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-image {
            width: 100%;
            border-radius: 16px;
            margin-bottom: 12px;
            object-fit: cover;
        }
        
        h1 {
            color: #ffeaea;
            font-size: 34px;
            margin-bottom: 18px;
            font-weight: 800;
            text-shadow: 0 2px 16px rgba(0,0,0,0.35);
        }
        
        p {
            color: #ddd;
            font-size: 18px;
            line-height: 1.9;
            margin: 0 auto 10px;
            max-width: 760px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="hero-image" src="/img/personagens.png" alt="Acesso Negado">
        <h1>Acesso Negado!</h1>
        <p>O site que você está tentando acessar foi bloqueado pela política de segurança desta rede.</p>
        <p>Evite o destino do nosso amigo azul e volte para uma área segura.</p>
    </div>
</body>
</html>
